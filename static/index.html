<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>furbo local</title>
<style>
  :root {
    --bg: #0e1113;
    --panel: #16191c;
    --line: #262b2f;
    --ink: #e6e9ea;
    --dim: #8a9296;
    --accent: #7fd1a8;
    --warn: #e0a26a;
    --bad: #e07a7a;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  h1 span { color: var(--dim); font-weight: 400; }
  .pill {
    font: 11px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase;
    padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--dim);
  }
  .pill.ok { color: var(--accent); border-color: #2c4a3c; }
  .pill.warn { color: var(--warn); border-color: #4a3d2c; }
  .pill.bad { color: var(--bad); border-color: #4a2c2c; }
  .spacer { flex: 1; }
  main { flex: 1; display: flex; min-height: 0; }
  .stage { flex: 1; min-width: 0; position: relative; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  aside {
    width: 320px; flex: none; border-left: 1px solid var(--line);
    background: var(--panel); overflow-y: auto; padding: 4px 0 24px;
  }
  .group { padding: 14px 16px 6px; border-bottom: 1px solid var(--line); }
  .group h2 {
    margin: 0 0 10px; font: 10px/1 var(--mono); letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); font-weight: 600;
  }
  .row { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
  .row label { flex: 1; color: var(--dim); }
  .row.tight { margin-bottom: 4px; }
  button, select, input[type=number] {
    font: inherit; color: var(--ink); background: #1e2226;
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px;
  }
  button { cursor: pointer; }
  button:hover { border-color: #3a4145; }
  button:active { background: #262b2f; }
  button.ghost { background: transparent; color: var(--dim); font-size: 12px; }
  button.primary { background: #22402f; border-color: #33604a; color: #cfeede; font-weight: 600; }
  button.wide { width: 100%; }
  .pan { display: flex; gap: 8px; }
  .pan button { flex: 1; font-size: 16px; line-height: 1; padding: 8px 0; }
  input[type=number] { width: 68px; }
  input[type=range] { flex: 1.4; accent-color: var(--accent); }
  .value { font: 12px/1 var(--mono); color: var(--dim); width: 30px; text-align: right; }
  .check { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; color: var(--dim); }
  .check input { accent-color: var(--accent); }
  details { padding: 12px 16px; }
  summary { cursor: pointer; color: var(--dim); font: 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  pre { margin: 10px 0 0; font: 11px/1.5 var(--mono); color: var(--dim); white-space: pre-wrap; word-break: break-word; }
  .error { color: var(--bad); font: 12px/1.5 var(--mono); margin: 10px 16px 0; }
  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(80px);
    background: #2a1f1f; border: 1px solid #4a2c2c; color: #f0c9c9;
    padding: 9px 14px; border-radius: 8px; font-size: 13px; opacity: 0;
    transition: opacity .18s, transform .18s; pointer-events: none; max-width: 70vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 820px) {
    main { flex-direction: column; }
    aside { width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: 55vh; }
    .stage { min-height: 40vh; }
  }
</style>
</head>
<body>
<header>
  <h1>furbo <span>local</span></h1>
  <div id="pill" class="pill">conectando</div>
  <div class="spacer"></div>
  <button class="ghost" id="reload">recarregar vídeo</button>
</header>

<main>
  <section class="stage"><iframe id="player" allow="autoplay; fullscreen"></iframe></section>

  <aside>
    <div class="group">
      <h2>Mover</h2>
      <div class="pan">
        <button data-pan="left" title="girar para a esquerda">&#9664;</button>
        <button data-pan="right" title="girar para a direita">&#9654;</button>
      </div>
      <div class="row">
        <label for="degrees">graus por toque</label>
        <input type="number" id="degrees" value="60" min="1" max="180" step="10">
      </div>
    </div>

    <div class="group">
      <h2>Petisco</h2>
      <button class="primary wide" id="toss">jogar petisco</button>
      <div class="row" style="margin-top:8px">
        <label>som</label>
        <button id="treat-sound">tocar</button>
      </div>
      <div class="row">
        <label for="treat_size">tamanho</label>
        <select id="treat_size" data-setting="treat_size">
          <option value="large">grande</option>
          <option value="small">pequeno</option>
        </select>
      </div>
    </div>

    <div class="group">
      <h2>Vídeo</h2>
      <div class="row">
        <label for="quality">qualidade</label>
        <select id="quality" data-setting="quality">
          <option value="1440p">1440p (2K)</option>
          <option value="1080p">1080p</option>
          <option value="720p">720p</option>
          <option value="360p">360p</option>
        </select>
      </div>
      <div class="row">
        <label for="volume">volume</label>
        <input type="range" id="volume" min="0" max="100" step="1">
        <span class="value" id="volume-out"></span>
      </div>
      <div class="row">
        <label for="night_mode">visão noturna</label>
        <select id="night_mode" data-setting="night_mode">
          <option value="auto">auto</option>
          <option value="on">ligada</option>
          <option value="off">desligada</option>
        </select>
      </div>
      <div class="row">
        <label for="bark_sensitivity">sensibilidade ao latido</label>
        <select id="bark_sensitivity" data-setting="bark_sensitivity">
          <option value="off">off</option>
          <option value="low">baixa</option>
          <option value="medium">média</option>
          <option value="high">alta</option>
        </select>
      </div>
    </div>

    <div class="group">
      <h2>Automação</h2>
      <label class="check"><input type="checkbox" data-setting="camera_on">câmera ligada</label>
      <label class="check"><input type="checkbox" data-setting="auto_tracking">seguir o pet</label>
      <label class="check"><input type="checkbox" data-setting="auto_zoom">zoom automático</label>
      <label class="check"><input type="checkbox" data-setting="voice_control">controle por voz</label>
      <label class="check"><input type="checkbox" data-setting="schedule_enabled">agenda</label>
      <label class="check"><input type="checkbox" data-setting="calm_enabled">acalmar o pet</label>
    </div>

    <details>
      <summary>estado bruto</summary>
      <div id="error" class="error"></div>
      <pre id="raw">aguardando…</pre>
    </details>
  </aside>
</main>

<div id="toast"></div>

<script>
const $ = (sel) => document.querySelector(sel);
const toast = (message) => {
  const el = $('#toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 3200);
};

async function api(path, body) {
  const response = await fetch('/api' + path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: body === undefined ? {} : { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await response.text();
  let data = text;
  try { data = JSON.parse(text); } catch (_) {}
  if (!response.ok) {
    const detail = (data && (data.detail || data.error)) || response.status;
    throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
  }
  return data;
}

// Não sobrescreve o que o usuário acabou de mexer enquanto a escrita não volta.
let dirty = false;
const settings = () => [...document.querySelectorAll('[data-setting]')];

function paint(state) {
  for (const el of settings()) {
    const key = el.dataset.setting;
    if (!(key in state)) continue;
    if (el.type === 'checkbox') el.checked = Boolean(state[key]);
    else if (el.type === 'range') { el.value = state[key]; $('#volume-out').textContent = state[key]; }
    else el.value = state[key];
  }
}

function paintStatus(status) {
  const pill = $('#pill');
  const mode = status.session_mode || '';
  const label = status.connected ? (mode ? 'conectado · ' + mode : 'conectado') : 'desconectado';
  pill.textContent = label;
  pill.className = 'pill ' + (status.connected ? (mode === 'relay' ? 'warn' : 'ok') : 'bad');
  $('#error').textContent = status.last_error || '';
  $('#raw').textContent = JSON.stringify(status, null, 2);
  if (!dirty && status.state) paint(status.state);
}

async function write(body) {
  dirty = true;
  try {
    const status = await api('/settings', body);
    paintStatus(status);
    if (body.quality) toast('qualidade ' + body.quality + ': vale na próxima abertura do vídeo');
  } catch (err) {
    toast('falhou: ' + err.message);
  } finally {
    dirty = false;
  }
}

async function poll() {
  try {
    paintStatus(await api('/status'));
  } catch (err) {
    const pill = $('#pill');
    pill.textContent = 'sem o bridge';
    pill.className = 'pill bad';
    $('#error').textContent = err.message;
  }
}

for (const el of settings()) {
  const key = el.dataset.setting;
  if (key === 'quality') continue;
  if (el.type === 'checkbox') {
    el.addEventListener('change', () => write({ [key]: el.checked }));
  } else if (el.type === 'range') {
    el.addEventListener('input', () => { $('#volume-out').textContent = el.value; });
    el.addEventListener('change', () => write({ [key]: Number(el.value) }));
  } else {
    el.addEventListener('change', () => write({ [key]: el.value }));
  }
}

$('#quality').addEventListener('change', (event) => write({ quality: event.target.value }));
$('#toss').addEventListener('click', async () => {
  try { await api('/toss', {}); toast('petisco lançado'); }
  catch (err) { toast('falhou: ' + err.message); }
});
$('#treat-sound').addEventListener('click', async () => {
  try { await api('/treat-sound', {}); toast('som tocado'); }
  catch (err) { toast('falhou: ' + err.message); }
});
for (const button of document.querySelectorAll('[data-pan]')) {
  button.addEventListener('click', async () => {
    const degrees = Number($('#degrees').value) || 60;
    try {
      await api('/pan', { direction: button.dataset.pan, degrees });
      toast('girando ' + (button.dataset.pan === 'left' ? 'à esquerda' : 'à direita'));
    } catch (err) { toast('falhou: ' + err.message); }
  });
}

$('#reload').addEventListener('click', loadPlayer);

async function loadPlayer() {
  try {
    const response = await fetch('/config.json');
    const config = await response.json();
    $('#player').src = config.player;
  } catch (err) {
    toast('player indisponível: ' + err.message);
  }
}

loadPlayer();
poll();
setInterval(poll, 5000);
</script>
</body>
</html>
